  # ------------------------------------------------------------ replying to a card (M5.3)
  - id: modify-add-label
    category: modify
    from: franck
    pending:
      - {action: create_issue, title: "Push notifications don't show up on iOS 17", body: "Notifications never arrive on iOS 17.", assignees: [annie-mb], labels: [bug]}
