      - [{action: ask_clarifying_question}]

  # ------------------------------------------------------------ other languages
  - id: lang-french-create
    category: language
    from: franck
    text: "l'appli plante quand j'ouvre les notifications sur iPhone, donne-le à Annie"
    expect:
      - {action: create_issue, people: [annie], title_words: [notification]}

  - id: lang-french-status
    category: language
    from: annie
