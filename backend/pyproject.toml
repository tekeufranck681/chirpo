[project]
name = "chirpo"
version = "0.1.0"
description = "Manage your GitHub from your team chat, in plain language. Open source and self-hostable."
license = "MIT"
authors = [{ name = "tekeu-franck" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "arq>=0.26",
    "asyncpg>=0.30",
    "cryptography>=45",
    "fastapi>=0.115",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=5.2",
    "sentry-sdk>=2.30",
    "sqlalchemy[asyncio]>=2.0.40",
    "structlog>=25.4",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
chirpo = "chirpo.cli:main"

[project.urls]
Repository = "https://github.com/tekeufranck681/chirpo"

[build-system]
requires = ["uv_build>=0.12.20,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.uv]
# Supply-chain cooldown (D18).
exclude-newer = "14 days"

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports, undefined names
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax for 3.12
    "SIM",      # simplifications
    "ASYNC",    # blocking calls inside async code
    "S",        # bandit: security issues
    "RUF",      # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",          # assert is how pytest works
    "S105", "S106",  # fake secrets are normal test data
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["chirpo"]
exclude = ["alembic/versions/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["chirpo.core", "chirpo.core.*"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One loop for the run so the session-scoped engine fixture can be shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a running Postgres (docker compose up -d postgres)"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
