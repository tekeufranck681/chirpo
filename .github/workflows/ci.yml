# Lint, type-check, and test every pull request and every push to main.
# Actions are pinned to full commit SHAs (tamper-proof); Dependabot keeps them updated.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chirpo
          POSTGRES_PASSWORD: chirpo
          POSTGRES_DB: chirpo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chirpo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHIRPO_DATABASE_URL: postgresql+asyncpg://chirpo:chirpo@localhost:5432/chirpo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest
