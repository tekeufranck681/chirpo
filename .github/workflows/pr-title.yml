# PRs are squash-merged and the PR title becomes the commit message on main (D11),
# so titles must follow Conventional Commits with a required scope: "type(scope): message",
# e.g. "feat(llm): add Gemini provider". This feeds automatic changelogs and version numbers.
# The allowed types and scopes are listed below; keep them in sync with CLAUDE.md.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
            revert
          requireScope: true
          scopes: |
            core
            telegram
            github
            llm
            db
            api
            worker
            dashboard
            config
            security
            docker
            deps
            ci
            docs
            setup
