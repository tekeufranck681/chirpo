# Dependabot opens PRs that update our dependencies. Updates are grouped into one PR per
# ecosystem per week, and only versions published at least 14 days ago are proposed
# (same cooldown as `exclude-newer` in pyproject.toml).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
