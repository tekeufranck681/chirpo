name: chirpo

x-backend: &backend
  build: ./backend
  image: chirpo-backend:dev
  pull_policy: build
  env_file:
    - path: .env
      required: false
  environment:
    # Built from POSTGRES_* so the password has one source (D29); overrides the localhost values in .env.
    CHIRPO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirpo}:${POSTGRES_PASSWORD:-chirpo}@db:5432/${POSTGRES_DB:-chirpo}
    CHIRPO_REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend/src:/app/src
    - ./backend/alembic:/app/alembic

services:
  migrate:
    <<: *backend
    command: ["chirpo", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["chirpo", "api", "--host", "0.0.0.0", "--reload"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["watchfiles", "--filter", "python", "chirpo worker", "/app/src"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    ports:
      - "127.0.0.1:${CADDY_HOST_PORT:-8080}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chirpo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chirpo}
      POSTGRES_DB: ${POSTGRES_DB:-chirpo}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.4-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:6.1.2
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  caddy-data:
