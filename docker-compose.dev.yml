name: chirpo

x-backend: &backend
  build: ./backend
  image: chirpo-backend:dev
  pull_policy: build
  env_file:
    - path: .env
      required: false
  environment:
    # Built from POSTGRES_* so the password has one source (D29); overrides the localhost values in .env.
    CHIRPO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirpo}:${POSTGRES_PASSWORD:-chirpo}@db:5432/${POSTGRES_DB:-chirpo}
    CHIRPO_REDIS_URL: redis://redis:6379/0
    # Only Caddy can reach the API (port not published), so its forwarded headers are trusted.
    CHIRPO_TRUSTED_PROXIES: "*"
    # The host path in .env doesn't exist inside the container; the key is mounted here instead.
    CHIRPO_GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/chirpo/github-app.pem
    # The worker's metrics port is not published; only Prometheus on this network can reach it (D57).
    CHIRPO_METRICS_HOST: 0.0.0.0
    # Fixed here (this beats .env) so it always matches deploy/monitoring/prometheus.yml.
    CHIRPO_METRICS_PORT: 9100
  volumes:
    - ./backend/src:/app/src
    - ./backend/alembic:/app/alembic
    - ./secrets:/run/secrets/chirpo:ro

services:
  migrate:
    <<: *backend
    command: ["chirpo", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["chirpo", "api", "--host", "0.0.0.0", "--reload"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["watchfiles", "--filter", "python", "chirpo worker", "/app/src"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  poller:
    <<: *backend
    command: ["watchfiles", "--filter", "python", "chirpo poll", "/app/src"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    ports:
      - "127.0.0.1:${CADDY_HOST_PORT:-8080}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chirpo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chirpo}
      POSTGRES_DB: ${POSTGRES_DB:-chirpo}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.4-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:6.1.2
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional: docker compose --profile monitoring up -d  (D57)
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.8.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.3.1
    # No default login: it refuses to start until GRAFANA_PASSWORD is set in .env.
    entrypoint:
      - /bin/sh
      - -c
      - '[ "$${#GF_SECURITY_ADMIN_PASSWORD}" -ge 12 ] || { echo "Set GRAFANA_PASSWORD in .env first (12 characters or more)"; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: "no"

volumes:
  db-data:
  redis-data:
  caddy-data:
  prometheus-data:
  grafana-data:
