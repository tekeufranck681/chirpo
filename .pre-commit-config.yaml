# Checks that run on `git commit`. Install once with: uv run pre-commit install
# Run on everything with: uv run pre-commit run --all-files
# ruff and mypy run through uv so they use the exact versions pinned in backend/uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check --project backend
        language: system
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
        files: ^backend/
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
